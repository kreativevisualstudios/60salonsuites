<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ee">
<meta name="description" content="60 Salon Suites leasing application.">
<title>Leasing Application | 60 Salon Suites</title>
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ee}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0}
/* This page uses a compact header, not the oversized hero header from the home page. */
.site-header{position:relative!important;inset:auto!important;z-index:5;box-sizing:border-box;flex:0 0 82px;width:100%;height:82px;min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(16px,4vw,48px)!important;background:#f7f4ee;color:#1c1c19!important;border-bottom:1px solid #e4ddcf}
.site-header .brand{display:flex;align-items:center;flex:0 1 auto;min-width:0;max-width:65%;}
.site-header .brand img{display:block!important;width:clamp(110px,18vw,190px)!important;max-width:100%!important;height:auto!important;max-height:58px;object-fit:contain}
.site-header nav{display:block!important;flex:0 0 auto;margin-left:auto}
.site-header nav a{display:inline-block;color:#1c1c19!important;font-size:14px;line-height:1.3;text-decoration:none;white-space:nowrap;padding:10px 13px;border:1px solid #c7ad69;border-radius:3px}
.site-header nav a:hover{background:#c7ad69;color:#1c1c19!important}
.leasing-embed{position:relative;flex:1 1 0;min-height:0;width:100%;margin:0;padding:0;overflow:hidden;background:#fff}
.leasing-embed iframe{display:block;width:100%;height:100%;min-height:0;border:0;margin:0;padding:0;background:#fff}
.embed-fallback{position:absolute;right:8px;bottom:8px;margin:0;padding:6px 10px;text-align:center;font-size:12px;background:rgba(247,244,238,.94);color:#625d54;border-radius:4px}
.embed-fallback a{color:#725b31}
.embed-fallback a{color:#725b31}
@media(max-width:650px){.site-header{flex:0 0 64px;height:64px;min-height:64px;padding:6px 12px!important;gap:8px}.site-header .brand{max-width:58%}.site-header .brand img{width:clamp(96px,34vw,138px)!important;max-height:46px}.site-header nav a{font-size:12px;padding:8px 9px}.embed-fallback{font-size:11px;right:5px;bottom:5px;padding:5px 7px}}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Back to 60 Salon Suites home"><img src="assets/60-salon-suites-logo.png" alt="60 Salon Suites"></a>
  <nav aria-label="Main navigation"><a href="index.html">Back to website</a></nav>
</header>
<main class="leasing-embed" aria-label="Leasing application">
  <iframe src="https://kreativevisualstudios.github.io/60salonsuitesform/" title="Complete 60 Salon Suites leasing application" loading="eager" allow="forms" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="embed-fallback">If the application cannot be displayed here, <a href="https://kreativevisualstudios.github.io/60salonsuitesform/" target="_blank" rel="noopener noreferrer">open the leasing form directly</a>.</div>
</main>
</body>
</html>
